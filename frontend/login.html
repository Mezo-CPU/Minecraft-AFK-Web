<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Console Login</title>
<style>
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #100a04; font-family: system-ui, sans-serif; color: #f2cba8;
  }
  form {
    background: #221508; border: 1px solid rgba(193,68,14,0.3); border-radius: 10px;
    padding: 32px; width: 280px; display: flex; flex-direction: column; gap: 14px;
  }
  h1 { font-size: 16px; margin: 0 0 6px; color: #e8895a; }
  input {
    background: #1a1008; border: 1px solid rgba(193,68,14,0.3); border-radius: 6px;
    padding: 10px 12px; color: #f2cba8; font-size: 14px;
  }
  button {
    background: #c1440e; border: none; border-radius: 6px; padding: 10px;
    color: white; font-weight: 600; cursor: pointer; font-size: 14px;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  #err { color: #e8895a; font-size: 13px; min-height: 16px; }
</style>
</head>
<body>
<form id="loginForm">
  <h1>Minecraft Console</h1>
  <input id="username" type="text" placeholder="Username" autocomplete="username" required>
  <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
  <div id="err"></div>
  <button type="submit" id="submitBtn">Log in</button>
</form>
<script src="config.js"></script>
<script>
(function () {
    const form   = document.getElementById('loginForm');
    const errEl  = document.getElementById('err');
    const btn    = document.getElementById('submitBtn');

    const cfg = window.CONSOLE_CONFIG || {};
    const loginUrl = (cfg.backendUrl || '').replace(/^wss:/, 'https:').replace(/^ws:/, 'http:') + '/login';

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errEl.textContent = '';
        btn.disabled = true;
        btn.textContent = 'Logging in...';
        try {
            const res = await fetch(loginUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: document.getElementById('username').value,
                    password: document.getElementById('password').value,
                }),
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Login failed');

            sessionStorage.setItem('mc_console_token', data.token);
            window.location.href = 'index.html';
        } catch (err) {
            errEl.textContent = err.message || 'Login failed';
            btn.disabled = false;
            btn.textContent = 'Log in';
        }
    });
})();
</script>
</body>
</html>
